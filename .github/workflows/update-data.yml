name: Update Case Data

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch homicide data (Washington Post / MAP)
        run: python3 scripts/fetch_homicides.py

      - name: Convert NamUs CSV if present
        run: |
          if [ -f "data/namus_unidentified_raw.csv" ]; then
            echo "Found namus_unidentified_raw.csv — converting..."
            python3 scripts/convert_namus_csv.py
          else
            echo "No raw CSV found — skipping unidentified conversion"
            echo "(Upload data/namus_unidentified_raw.csv to generate unidentified.json)"
          fi

      - name: Show data file sizes
        run: |
          echo "=== Data files ==="
          ls -lh data/*.json 2>/dev/null || echo "No data files"
          echo ""
          echo "Homicides:"
          python3 -c "
          import json
          d = json.load(open('data/homicides.json'))
          print(f'  {d[\"count\"]} cases — {d[\"generated\"]}')
          " 2>/dev/null || echo "  (not available)"
          echo ""
          echo "Unidentified:"
          python3 -c "
          import json
          d = json.load(open('data/unidentified.json'))
          print(f'  {d[\"count\"]} cases — {d[\"generated\"]}')
          " 2>/dev/null || echo "  (not available)"

      - name: Commit updated data
        run: |
          git config user.name  "CASENET Data Bot"
          git config user.email "actions@github.com"
          git add data/homicides.json
          git add data/unidentified.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-update case data [$(date -u '+%Y-%m-%d')]"
          git push
