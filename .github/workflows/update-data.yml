name: Update Case Data

on:
  schedule:
    # Runs every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and convert homicide data
        run: python3 scripts/fetch_homicides.py

      - name: Fetch and convert unidentified remains data
        run: python3 scripts/fetch_unidentified.py

      - name: Commit updated data files
        run: |
          git config user.name  "CASENET Data Bot"
          git config user.email "actions@github.com"
          git add data/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Auto-update case data [$(date -u '+%Y-%m-%d')]"
          git push
